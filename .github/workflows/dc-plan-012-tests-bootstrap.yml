name: DC-PLAN-012 test contract bootstrap

on:
  push:
    branches:
      - codex/dc-plan-012-combatant-conditions-atomicity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align unit expectations with condition-safe writes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rules/combat-pipeline.test.ts')
          text = path.read_text()
          replacements = [
              (
                  '''      expect(tx.combatant.update).toHaveBeenCalledWith({\n        where: { id: "enemy-1" },\n        data: { hp: { decrement: 3 }, conditions: [] },\n      });''',
                  '''      expect(tx.combatant.update).toHaveBeenCalledWith({\n        where: { id: "enemy-1" },\n        data: { hp: { decrement: 3 } },\n      });'''
              ),
              (
                  '''      expect(tx.combatant.update).toHaveBeenCalledWith({\n        where: { id: "enemy-1" },\n        data: { hp: { decrement: 0 }, conditions: [] },\n      });''',
                  '''      expect(tx.combatant.update).toHaveBeenCalledWith({\n        where: { id: "enemy-1" },\n        data: { hp: { decrement: 0 } },\n      });'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact unit assertion, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Remove bootstrap workflow and commit
        run: |
          rm .github/workflows/dc-plan-012-tests-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules/combat-pipeline.test.ts .github/workflows/dc-plan-012-tests-bootstrap.yml
          git diff --cached --check
          git commit -m "test(rules): stop expecting stale condition rewrites"
          git push origin HEAD:codex/dc-plan-012-combatant-conditions-atomicity
