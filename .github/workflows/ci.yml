name: CI

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-dc-plan-011:
    if: ${{ github.head_ref == 'codex/dc-plan-011-action-spell-slot-atomicity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dc-plan-011-action-spell-slot-atomicity
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Capture unit diagnostics and restore workflow
        shell: bash
        run: |
          set +e
          pnpm test > dc-plan-011-unit.log 2>&1
          status=$?
          set -e
          printf '\nEXIT_STATUS=%s\n' "$status" >> dc-plan-011-unit.log
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dc-plan-011-unit.log .github/workflows/ci.yml
          git commit -m "chore: capture DC-PLAN-011 unit diagnostics"
          git push origin HEAD:codex/dc-plan-011-action-spell-slot-atomicity
