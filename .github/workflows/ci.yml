name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-dc-plan-011:
    name: Apply DC-PLAN-011 unit compatibility adjustment
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/dc-plan-011-action-spell-slot-atomicity' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dc-plan-011-action-spell-slot-atomicity
          fetch-depth: 0
      - name: Patch and restore workflow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('lib/rules/combat-pipeline.ts')
          text = path.read_text()
          old = '''    if (consumesSlot) {\n      if (!payload.rawSpellSlots || !playerCharacterId) {\n        throw new SpellSlotClaimError(payload.spellLevel);\n      }\n      await claimSpellSlot(\n        tx,\n        playerCharacterId,\n        payload.rawSpellSlots,\n        payload.spellLevel\n      );\n    }'''
          new = '''    if (consumesSlot && playerCharacterId) {\n      if (!payload.rawSpellSlots) {\n        throw new SpellSlotClaimError(payload.spellLevel);\n      }\n      await claimSpellSlot(\n        tx,\n        playerCharacterId,\n        payload.rawSpellSlots,\n        payload.spellLevel\n      );\n    }'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new))
          PY
          git show origin/master:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/rules/combat-pipeline.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix(rules): preserve reduced combat pipeline callers"
          git push origin HEAD:codex/dc-plan-011-action-spell-slot-atomicity
