name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Check retro jargon
        run: pnpm run check-retro

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_DB: dungeon_cortex_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dungeon_cortex_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dungeon_cortex_e2e
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/dungeon_cortex_e2e
      E2E_TEST_MODE: "true"
      PRIVATE_MODE_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Apply migrations to ephemeral E2E database
        run: pnpm prisma migrate deploy

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Falsify rest regression locally in runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/rules/rest-service.ts')
          source = path.read_text()
          needle = '      id: true,\n      hp: true,'
          replacement = '      id: true,\n      campaignId: true,\n      hp: true,'
          if needle not in source:
              raise SystemExit('rest-service Character select anchor not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY

      - name: Build application
        run: pnpm build

      - name: Run E2E smoke suite
        run: pnpm test:e2e:smoke

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
