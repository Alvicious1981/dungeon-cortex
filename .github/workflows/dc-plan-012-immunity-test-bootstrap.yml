name: DC-PLAN-012 immunity contract bootstrap

on:
  push:
    branches:
      - codex/dc-plan-012-combatant-conditions-atomicity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align immune-target unit expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/rules/combat-pipeline.test.ts')
          text = path.read_text()
          old = '''    expect(tx.combatant.update).toHaveBeenCalledWith(
      expect.objectContaining({
        data: expect.objectContaining({ conditions: [] }),
      })
    );'''
          new = '''    expect(tx.combatant.update).toHaveBeenCalledTimes(1);
    expect(tx.combatant.update).toHaveBeenCalledWith({
      where: { id: "enemy-1" },
      data: { hp: { decrement: 2 } },
    });'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one exact immunity assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove bootstrap workflow and commit
        run: |
          rm .github/workflows/dc-plan-012-immunity-test-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/rules/combat-pipeline.test.ts .github/workflows/dc-plan-012-immunity-test-bootstrap.yml
          git diff --cached --check
          git commit -m "test(rules): keep immune condition writes absent"
          git push origin HEAD:codex/dc-plan-012-combatant-conditions-atomicity
